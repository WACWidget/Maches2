<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WAC Match Center</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;background:#0b1220;color:#e5edf9;
font:13px Arial,sans-serif}
.panel{background:#111c30;border:1px solid #243958;border-radius:12px;
padding:12px;margin-bottom:10px}
h2{font-size:16px;margin:0 0 10px;color:#8ec5ff}
h3{font-size:12px;margin:0 0 9px;color:#b9d9ff}
.match{background:#0b1628;border:1px solid #243958;border-radius:8px;
padding:9px;margin-top:7px}
.match strong{display:block;margin-bottom:5px;line-height:1.35}
.meta{font-size:11px;color:#9db1cd;margin-bottom:8px}
a.join{display:inline-block;text-decoration:none;background:#2878df;
color:white;padding:6px 10px;border-radius:6px;font-weight:bold;font-size:11px}
a.join:hover{background:#4595ff}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nav{display:flex;align-items:center;gap:8px}
button{background:#1b2b45;color:#d8eaff;border:1px solid #355276;
border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{background:#28466c}
#month{font-weight:bold;text-align:center;flex:1}
.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.week{margin:12px 0 6px;text-align:center;color:#8da9ca;font-size:10px}
.day{min-width:0;aspect-ratio:1;padding:4px 0;border-radius:6px;
display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:3px;background:#17243a;border:1px solid transparent;font-size:12px}
.day.empty{background:transparent}
.day.today{border-color:#61aaff}
.day.selected{background:#20569a;border-color:#8bc6ff}
.dot{width:5px;height:5px;border-radius:50%;background:#4ba3ff}
.day.has-live .dot{background:#46dfac}
.day.has-ended .dot{background:#71829b}
#details{margin-top:12px}
.muted{color:#91a6c4;font-size:11px;line-height:1.5}
.error{color:#ffb4b4}
.toggle-btn{margin-top:10px;width:100%;background:#203450;border:1px dashed #3f628c;color:#aaccff}
.toggle-btn:hover{background:#2c466b}
</style>
</head>
<body>

<section class="panel">
  <h2>♟ WAC MATCH CENTER</h2>
  <div class="muted">We Are The Champions · Club matches</div>
  <div id="featured"></div>
</section>

<section class="panel">
  <div class="top">
    <button id="prev" aria-label="Previous month">‹</button>
    <div id="month"></div>
    <button id="next" aria-label="Next month">›</button>
  </div>
  <div class="week">
    <span>MON</span><span>TUE</span><span>WED</span>
    <span>THU</span><span>FRI</span><span>SAT</span><span>SUN</span>
  </div>
  <div class="days" id="days"></div>
  <div id="details"><div class="muted">Select a date to see matches.</div></div>
  <div class="muted" style="margin-top:12px">
    <span style="color:#4ba3ff">●</span> Match
    &nbsp; <span style="color:#46dfac">●</span> Live
    &nbsp; <span style="color:#71829b">●</span> Ended
  </div>
  <div id="status" class="muted" style="margin-top:8px">Loading matches…</div>
</section>

<script>
const API = "https://api.chess.com/pub/club/we-are-the-champions-7/matches";
const CLUB = "https://www.chess.com/club/we-are-the-champions-7";
const $ = id => document.getElementById(id);

let matches = [];
let selected = new Date();
let view = new Date(selected.getFullYear(), selected.getMonth(), 1);
let isExpanded = false;

const pad = n => String(n).padStart(2, "0");
const dateKey = d =>
  `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

function matchUrl(m) {
  const raw = m.url || m["@id"] || "";
  const id = raw.match(/\/(?:pub\/)?match\/(\d+)/i);
  return id ? `https://www.chess.com/club/matches/${id[1]}` :
    (raw.startsWith("https://www.chess.com/") ? raw : CLUB);
}

function matchCard(m, type) {
  const card = document.createElement("div");
  card.className = "match";

  const title = document.createElement("strong");
  title.textContent = m.name || "Club match";

  const meta = document.createElement("div");
  meta.className = "meta";
  const labels = {
    registered: "CRITICAL SUPPORT NEEDED · Need Players!",
    in_progress: "LIVE NOW",
    finished: "ENDED"
  };
  meta.textContent = labels[type] || "CLUB MATCH";

  const link = document.createElement("a");
  link.className = "join";
  link.href = matchUrl(m);
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.textContent = type === "registered" ? "JOIN MATCH →" : "VIEW MATCH →";

  card.append(title, meta, link);
  return card;
}

function getDate(m) {
  if (!m.start_time) return null;
  return dateKey(new Date(m.start_time * 1000));
}

function getPriorityScore(m) {
  let score = 0;
  const name = (m.name || "").toUpperCase();

  // 1. Kadro Eksiği Olup Kayıt Aşamasında Olanlar (En Yüksek Öncelik)
  if (m.type === "registered") {
    score += 1000;
  }

  // 2. 1WL veya TCMAC Lig Maçları (İkincil Öncelik)
  const is1WL = name.includes("1WL") || name.includes("ONE WORLD");
  const isTCMAC = name.includes("TCMAC") || name.includes("TURKISH");

  if (is1WL) score += 200;
  if (isTCMAC) score += 100;

  // Maç canlı ise ekstra öncelik ver
  if (m.type === "in_progress") score += 50;

  return score;
}

function renderFeatured() {
  const box = $("featured");
  box.replaceChildren();

  // Öncelik puanına göre sırala
  const sortedMatches = [...matches].sort((a, b) => getPriorityScore(b) - getPriorityScore(a));
  
  const limit = isExpanded ? 5 : 3;
  const featuredList = sortedMatches.slice(0, limit);

  const heading = document.createElement("h3");
  heading.style.marginTop = "14px";
  heading.textContent = "⚡ FEATURED & NEEDED MATCHES";
  box.append(heading);

  if (featuredList.length) {
    featuredList.forEach(m => box.append(matchCard(m, m.type)));

    if (sortedMatches.length > 3) {
      const toggleBtn = document.createElement("button");
      toggleBtn.className = "toggle-btn";
      toggleBtn.textContent = isExpanded 
        ? "Show Less (3 Matches)" 
        : `Show More (${Math.min(5, sortedMatches.length)} Matches)`;
      
      toggleBtn.addEventListener("click", () => {
        isExpanded = !isExpanded;
        renderFeatured();
      });
      box.append(toggleBtn);
    }
  } else {
    const p = document.createElement("div");
    p.className = "muted";
    p.textContent = "No active matches found.";
    box.append(p);
  }
}

function renderCalendar() {
  $("month").textContent = view.toLocaleDateString("en-US", {
    month: "long", year: "numeric"
  });

  const daysBox = $("days");
  daysBox.replaceChildren();

  const first = new Date(view.getFullYear(), view.getMonth(), 1);
  const offset = (first.getDay() + 6) % 7;
  const count = new Date(view.getFullYear(), view.getMonth()+1, 0).getDate();
  const today = dateKey(new Date());

  for (let i = 0; i < offset; i++) {
    const empty = document.createElement("div");
    empty.className = "day empty";
    daysBox.append(empty);
  }

  for (let n = 1; n <= count; n++) {
    const d = new Date(view.getFullYear(), view.getMonth(), n);
    const key = dateKey(d);
    const events = matches.filter(m => getDate(m) === key);
    const hasLive = events.some(m => m.type === "in_progress");
    const hasEnded = events.length && events.every(m => m.type === "finished");

    const b = document.createElement("button");
    b.className = "day";
    if (key === today) b.classList.add("today");
    if (key === dateKey(selected)) b.classList.add("selected");
    if (hasLive) b.classList.add("has-live");
    else if (hasEnded) b.classList.add("has-ended");

    const num = document.createElement("span");
    num.textContent = n;
    b.append(num);

    if (events.length) {
      const dot = document.createElement("span");
      dot.className = "dot";
      b.append(dot);
    }

    b.addEventListener("click", () => {
      selected = d;
      renderCalendar();
      renderDetails();
    });
    daysBox.append(b);
  }
}

function renderDetails() {
  const box = $("details");
  box.replaceChildren();

  const heading = document.createElement("h3");
  heading.textContent = selected.toLocaleDateString("en-US", {
    weekday: "short", month: "short", day: "numeric", year: "numeric"
  });
  box.append(heading);

  const found = matches.filter(m => getDate(m) === dateKey(selected));
  if (!found.length) {
    const p = document.createElement("div");
    p.className = "muted";
    p.textContent = "No matches with a scheduled start date were found for this day.";
    box.append(p);
    return;
  }

  found.forEach(m => box.append(matchCard(m, m.type)));
}

async function loadMatches() {
  try {
    const response = await fetch(API);
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();

    matches = [];
    ["in_progress", "registered", "finished"].forEach(type => {
      (data[type] || []).forEach(m => matches.push({...m, type}));
    });

    renderFeatured();
    renderCalendar();
    renderDetails();
    $("status").textContent =
      `Loaded ${matches.length} matches · Data provided by Chess.com`;
  } catch (e) {
    $("status").innerHTML =
      '<span class="error">Could not load matches. Open the club page to check matches.</span>';
    const link = document.createElement("a");
    link.className = "join";
    link.href = CLUB;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = "OPEN WAC CLUB →";
    $("status").append(document.createElement("br"), link);
  }
}

$("prev").addEventListener("click", () => {
  view.setMonth(view.getMonth()-1);
  renderCalendar();
});
$("next").addEventListener("click", () => {
  view.setMonth(view.getMonth()+1);
  renderCalendar();
});

renderCalendar();
renderDetails();
loadMatches();
</script>
</body>
</html>
